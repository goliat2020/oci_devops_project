version: 0.1 
component: build
timeoutInSeconds: 600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java22"
    command: yum -y install graalvm-22-jdk.x86_64;
             ls /usr/lib64/graalvm/

  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH

  - type: Command
    name: "Docker Login"
    command: cd MtdrSpring;
             oci os object get --bucket-name reacttodo-fpoyo --name deployment_config.tgz --file deployment_config.tgz;
             tar -xzvf deployment_config.tgz;
             source env.sh;
             cat at.cfg | docker login -u "axavu6shp9jt/a00227610@tec.mx" --password-stdin mx-queretaro-1.ocir.io

  - type: Command 
    name: "Build"
    command: cd MtdrSpring;
             source env.sh;
             rm -rf backend/src/main/frontend/build;
             (cd backend;source build.sh)

  - type: Command
    name: "Install K8s"
    command: mkdir -p $HOME/.kube;
             mkdir -p $HOME/k8s;
             cd $HOME/k8s;
             wget https://dl.k8s.io/v1.31.2/bin/linux/amd64/kubectl;
             chmod +x kubectl;
             export PATH=$PATH:$HOME/k8s;
             kubectl version --client;
             oci ce cluster create-kubeconfig --cluster-id ocid1.cluster.oc1.mx-queretaro-1.aaaaaaaasu4y2kuzyk4edovsnnwnc4bomnm2ieg7golm5pnb2cfwxbimnucq --file $HOME/.kube/config --region mx-queretaro-1 --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT;
             export KUBECONFIG=$HOME/.kube/config

